<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Preservação da Vida Marinha</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            color: white;
            overflow: hidden;
            position: relative;
            transition: background-image 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 30, 60, 0.65);
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            background: rgba(0, 183, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-family: 'Playfair Display SC', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .login-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #f0f8ff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0074d9, #00a8e8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Playfair Display SC', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 116, 217, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0063b8, #0094d1);
            transform: translateY(-2px);
            color: rgb(255, 196, 0);
            box-shadow: 0 10px 25px rgba(0, 116, 217, 0.6);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .divider span {
            padding: 0 15px;
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-google:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-google i {
            font-size: 20px;
            color: #DB4437;
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .footer-links a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .logo-mini {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-mini img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .bg-indicator {
            position: fixed;
            top: 50%;
            right: 25px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .bg-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .bg-dot.active {
            background: #00d4ff;
            transform: scale(1.2);
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 25px;
            }

            .login-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo-mini">
            <img src="https://i.ibb.co/7dVmxzpb/Captura-de-tela-2026-05-05-102227-1.png" alt="Logo">
        </div>

        <div class="login-header">
            <h1>OPÇÕES DE LOGIN</h1>
            <p>Acesse sua conta para explorar e proteger nossos oceanos</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">NOME/EMAIL</label>
                <input type="text" id="email" name="email" placeholder="Digite seu nome ou e-mail" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">SENHA</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">LOGAR</button>
        </form>

        <div class="divider">
            <span>OU</span>
        </div>

        <button type="button" class="btn-google" onclick="loginWithGoogle()">
            <i class="fab fa-google"></i>
            LOGIN COM GOOGLE
        </button>

        <div class="footer-links">
            <a href="#">Esqueceu a senha?</a>
            <a href="cadastro.html">Criar conta</a>
        </div>
    </div>


    <div class="bg-indicator" id="bgIndicator"></div>

    <script>
        const backgroundImages = [
            'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=1920&q=80',
            'https://i.ibb.co/YTBLcxrB/08-06-2022-Dia-Mundial-dos-Oceanos-medico-veterinario-e-essencial-na-preservacao-da-vida-marinha-fr.jpg',
            'https://i.ibb.co/gLR0y1Ph/underwater-802092-1920.webp',
            'https://i.ibb.co/wNpq03Dc/Chat-GPT-Image-4-de-mar-de-2026-08-42-05-1-1.webp',
            'https://i.ibb.co/HTjNSVHk/images-q-tbn-ANd9-Gc-SIWBxl24f-K-devjnmvetrxv-IVj-G9cfioj-LUQ-s.jpg'
        ];

        let currentBgIndex = 0;
        const bgIndicator = document.getElementById('bgIndicator');

        backgroundImages.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = `bg-dot ${index === 0 ? 'active' : ''}`;
            dot.onclick = () => changeBackground(index);
            bgIndicator.appendChild(dot);
        });


        function changeBackground(index) {
            currentBgIndex = index;
            document.body.style.backgroundImage = `url('${backgroundImages[index]}')`;


            document.querySelectorAll('.bg-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }


        function startBackgroundRotation() {
            setInterval(() => {
                currentBgIndex = (currentBgIndex + 1) % backgroundImages.length;
                changeBackground(currentBgIndex);
            }, 15000);
        }

        changeBackground(0);
        startBackgroundRotation();


        // === LOGIN FUNCIONAL COM LOCALSTORAGE ===
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const inputLogin = document.getElementById('email').value.trim(); // Nome ou Email
            const password = document.getElementById('password').value.trim();

            const userDataString = localStorage.getItem('usuarioCadastrado');

            if (!userDataString) {
                alert("❌ Nenhuma conta cadastrada ainda. Crie uma conta primeiro.");
                return;
            }

            const usuario = JSON.parse(userDataString);

            // Verifica se o login bate com Nome OU Email + Senha
            const loginValido =
                (inputLogin === usuario.nome || inputLogin === usuario.email) &&
                password === usuario.password;

            if (loginValido) {
                alert(`✅ Login realizado com sucesso!\n\nBem-vindo, ${usuario.nome}!`);

                // Aqui você pode redirecionar para a página principal depois
                window.location.href = "inicial.html";

                console.log("Login bem-sucedido:", usuario);
            } else {
                alert("❌ Usuário ou senha incorretos!\n\nVerifique seus dados e tente novamente.");
            }
        });
    </script>
</body>

</html>
